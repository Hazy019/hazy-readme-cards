  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #060810;
      --surface: #0e1117;
      --border:  #1e2530;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #39d353;
      --mid:     #79c0ff;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 32px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    header .badge {
      display: inline-block;
      background: #0f2a18;
      border: 1px solid #1a4a2a;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
    }

    .card-group {
      max-width: 1900px;
      margin: 0 auto 52px;
    }

    .card-group h2 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .card-group h2::before { content: "// "; color: var(--accent); }

    .theme-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .theme-col { display: flex; flex-direction: column; gap: 8px; }

    .theme-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .dark-label  { color: #39d353; }
    .light-label { color: #1a7f37; }

    .svg-wrap {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .svg-wrap svg { display: block; width: 100%; height: auto; }

    .dark-bg  { background: #0d1117; }
    .light-bg { background: #ffffff; }

    hr.divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 0 52px;
    }

    footer-note {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 60px;
    }
  </style>
</head>
