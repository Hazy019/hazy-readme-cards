<svg xmlns="http://www.w3.org/2000/svg" width="900" height="156" viewBox="0 0 900 156">
<defs>
  <clipPath id="hc"><rect width="900" height="156" rx="8"/></clipPath>
  <!-- Gradient on title bar: solid left → fades to bg right (depth) -->
  <linearGradient id="hBarGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#12151b"/>
    <stop offset="100%" stop-color="#0a0c10"/>
  </linearGradient>
</defs>
<g clip-path="url(#hc)">

  <!-- Base background -->
  <rect width="900" height="156" fill="#0a0c10"/>

  <!-- ── TITLE BAR ──────────────────────────────────────────────────────── -->
  <rect width="900" height="32" fill="url(#hBarGrad)"/>
  <rect y="31.5" width="900" height="0.5" fill="#30363d" opacity="0.6"/>

  <!-- Mac traffic-light dots (visual rhyme: also in footer) -->
  <circle cx="22" cy="16" r="4.5" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="4.5" fill="#febc2e"/>
  <circle cx="54" cy="16" r="4.5" fill="#28c840"/>
  <text x="74" y="20.5"
        font-family="'Courier New', Consolas, monospace"
        font-size="11" font-weight="600"
        fill="#6e7681" letter-spacing="0.5">~/kyrell-santillan — zsh</text>

  <!-- ── HERO NAME (star typography moment) ────────────────────────────── -->
  <text x="28" y="80"
        font-family="'Courier New', Consolas, monospace"
        font-size="34" font-weight="900"
        fill="#e6edf3" letter-spacing="-0.5">Kyrell Santillan</text>

  <!-- Accent underline under name (depth: makes name feel grounded) -->
  <rect x="28" y="85" width="248" height="2" rx="1"
        fill="#39d353" opacity="0.35"/>

  <!-- ── ROLE LINE ──────────────────────────────────────────────────────── -->
  <text x="28" y="104"
        font-family="'Courier New', Consolas, monospace"
        font-size="11" fill="#8b949e" letter-spacing="0.5">Web Designer  ·  Frontend Engineer  ·  Cybersecurity  ·  Philippines  ·  UTC+8</text>

  <!-- ── OPEN FOR WORK BADGE ───────────────────────────────────────────── -->
  <rect x="28" y="116" width="122" height="18" rx="9" fill="#0f2a18"/>
  <!-- Dot bullet (visual rhyme: same motif in footer link pills + profile bullets) -->
  <circle cx="41" cy="125" r="3.5" fill="#39d353"/>
  <text x="53" y="128.5"
        font-family="'Courier New', Consolas, monospace"
        font-size="9.5" font-weight="700"
        fill="#39d353" letter-spacing="0.5">OPEN FOR WORK</text>

  <!-- ── LEFT ACCENT STRIP (visual rhyme anchor — on every card) ────────── -->
  <rect x="0" y="0" width="3" height="156" fill="#39d353" opacity="0.7"/>

  <!-- Card border -->
  <rect y="0" width="900" height="1" fill="#30363d"/>
  <rect x="899" y="0" width="1" height="156" fill="#30363d"/>
  <rect y="155" width="900" height="1" fill="#30363d"/>

</g>
</svg>